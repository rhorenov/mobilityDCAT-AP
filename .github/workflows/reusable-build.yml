name: Reusable — build spec

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name for the uploaded dist artifact'
        type: string
        default: 'spec-dist'
      draft_label:
        description: 'What the build is, for the draft notice (see src/scripts/mark-draft.py); empty for a release, which gets no notice'
        type: string
        default: ''
    outputs:
      artifact_name:
        description: 'Name of the uploaded dist artifact (pass to reusable-publish-gh-pages)'
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    # A fixed Ubuntu release, not ubuntu-latest. GitHub still updates the
    # image weekly, which is why ReSpec does not render with its Chrome.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ inputs.artifact_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      # Installs the Node and uv versions pinned in .mise.toml. From here on
      # every step is a mise task, so CI runs what `mise run lint` runs locally.
      - name: Set up mise
        uses: jdx/mise-action@v4

      # Download caches only, not node_modules or .venv: both are content
      # addressed, so a stale entry is harmless and restore-keys are safe
      - name: Restore npm and uv download caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.cache/uv
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'uv.lock') }}
          restore-keys: deps-${{ runner.os }}-

      # The Chrome build puppeteer pins, installed by `mise run install`, so CI
      # renders with the same browser as a local build. Keyed on the lockfile:
      # a puppeteer update brings a new Chrome and starts an empty cache. No
      # restore-keys, so old Chrome builds do not pile up in it.
      - name: Restore Chrome cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: mise run install

      # Ubuntu 24.04 uses AppArmor to block the unprivileged user namespaces
      # Chrome's sandbox needs. The image's own Chrome falls back to a setuid
      # helper; Chrome for Testing has none and refuses to start. Lifting the
      # restriction on this throwaway runner keeps the sandbox on.
      - name: Allow the Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: mise run build

      - name: Mark as draft
        if: inputs.draft_label != ''
        env:
          DRAFT_LABEL: ${{ inputs.draft_label }}
        run: mise run mark-draft

      # The script trusts whatever is cached, so there are no restore-keys: a
      # new month or a change to the shapes starts empty and picks up updates
      - name: Get the month for the SHACL cache key
        id: month
        run: echo "month=$(date +%Y-%m)" >> $GITHUB_OUTPUT

      - name: Restore SHACL imports cache
        uses: actions/cache@v6
        with:
          path: .cache/shacl
          key: shacl-imports-${{ hashFiles('src/shacl/*.ttl') }}-${{ steps.month.outputs.month }}

      # Reported, not enforced: a failed check does not stop a publish
      - name: Check
        run: mise run check
        continue-on-error: true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/
